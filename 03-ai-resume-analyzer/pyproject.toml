[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-resume-analyzer"
version = "0.1.0"
description = "An AI-powered resume extraction and analysis API"
requires-python = ">=3.13"
dependencies = [
"fastapi",
"uvicorn[standard]",
"python-multipart",
"pypdf",
"pydantic",
"email-validator",
"python-dotenv",
"groq",
]

[project.optional-dependencies]
dev = [
"pytest",
"httpx",
"reportlab",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
